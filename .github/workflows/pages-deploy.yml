name: Deploy Pages

# Builds the static site and uploads it to the Cloudflare Pages project
# (direct upload). The Worker cron dispatches this when a status changes,
# and the daily schedule refreshes the JSAUX prices on the product cards.
on:
  workflow_dispatch:
    inputs:
      checked_at:
        description: Time of the stock check that asked for this build. The build waits until status.json has it.
        required: false
        type: string
  schedule:
    - cron: '30 5 * * *'
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CF_PAGES: '1'
          PRERENDER_SOURCE_URL: https://steamhardwarestock.pages.dev
          PRERENDER_MIN_GENERATED_AT: ${{ inputs.checked_at }}
          # Optional repo variables (not secrets). Empty means no affiliate links.
          AFFILIATE_JSAUX_REF: ${{ vars.AFFILIATE_JSAUX_REF }}
          AFFILIATE_AMAZON_ENABLED: ${{ vars.AFFILIATE_AMAZON_ENABLED }}
          AFFILIATE_AMAZON_TAG: ${{ vars.AFFILIATE_AMAZON_TAG }}

      # Hashes every sitemap page into dist/indexnow-manifest.json, and keeps
      # the live one to compare with after the deploy.
      - name: Prepare IndexNow manifest
        run: |
          node scripts/indexnow.mjs manifest dist
          curl -fsS --max-time 20 https://steamhardwarestock.com/indexnow-manifest.json -o "$RUNNER_TEMP/previous-manifest.json" || echo "No live IndexNow manifest yet"

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name steamhardwarestock --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Submits pages whose content changed, plus new and removed URLs. The
      # key in scripts/indexnow.mjs is public by design. A failed ping never
      # fails the deploy.
      - name: Ping IndexNow
        run: node scripts/indexnow.mjs ping "$RUNNER_TEMP/previous-manifest.json" dist
