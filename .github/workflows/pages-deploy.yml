name: Deploy Pages

# Builds the static site and uploads it to the Cloudflare Pages project
# (direct upload). The Worker cron dispatches this when a status changes.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CF_PAGES: '1'
          PRERENDER_SOURCE_URL: https://steamhardwarestock.pages.dev
          # Optional repo variables (not secrets). Empty means no affiliate links.
          AFFILIATE_JSAUX_REF: ${{ vars.AFFILIATE_JSAUX_REF }}
          AFFILIATE_AMAZON_ENABLED: ${{ vars.AFFILIATE_AMAZON_ENABLED }}
          AFFILIATE_AMAZON_TAG: ${{ vars.AFFILIATE_AMAZON_TAG }}

      # Kept to compare lastmod values for IndexNow after the deploy.
      - name: Save the live sitemap
        run: curl -fsS --max-time 20 https://steamhardwarestock.com/sitemap.xml -o "$RUNNER_TEMP/previous-sitemap.xml" || true

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name steamhardwarestock --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Submits new or changed sitemap URLs. The key in scripts/indexnow.mjs
      # is public by design. A failed ping never fails the deploy.
      - name: Ping IndexNow
        run: node scripts/indexnow.mjs "$RUNNER_TEMP/previous-sitemap.xml" dist/sitemap.xml
