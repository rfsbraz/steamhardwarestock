name: CI

on:
  push:
    branches: [main]
  # Every PR, so stacked PRs that target another PR branch also get checked.
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check syntax
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build static site
        run: npm run build
