name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Use RELEASE_PLEASE_TOKEN if configured so release-created tags can trigger downstream workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
