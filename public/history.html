<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock history - Steam hardware stock tracker</title>
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = 'auto';
        document.documentElement.dataset.theme = t;
      } catch (_) {
        document.documentElement.dataset.theme = 'auto';
      }
    })();
  </script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Steam hardware</p>
        <h1>Stock history</h1>
      </div>
      <div class="topbar-right">
        <button id="themeToggle" type="button" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
          <span id="themeToggleLabel">Auto</span>
        </button>
      </div>
    </header>

    <p class="intro">
      All recorded stock transitions across products and regions. History is captured while the tracker is watching.
      <span id="historyAsOf" class="history-as-of"></span>
    </p>

    <section class="results-section" aria-label="History filters">
      <div class="history-filters">
        <label class="field">
          <span>Search region</span>
          <input id="filterRegion" type="search" placeholder="US, JP, Germany...">
        </label>
        <label class="field">
          <span>Sort by</span>
          <select id="filterSort">
            <option value="lastInStock">Last in stock (newest)</option>
            <option value="lastOutOfStock">Last out of stock (newest)</option>
            <option value="product">Product</option>
            <option value="region">Region</option>
            <option value="events">Event count</option>
          </select>
        </label>
        <fieldset class="field history-fieldset">
          <legend>Status</legend>
          <label><input type="radio" name="filterStatus" value="all" checked> All</label>
          <label><input type="radio" name="filterStatus" value="in"> In stock</label>
          <label><input type="radio" name="filterStatus" value="out"> Out of stock</label>
        </fieldset>
        <fieldset class="field history-fieldset">
          <legend>Source</legend>
          <label><input type="radio" name="filterSource" value="all" checked> All</label>
          <label><input type="radio" name="filterSource" value="steam"> Steam</label>
          <label><input type="radio" name="filterSource" value="komodo"> Komodo</label>
        </fieldset>
        <fieldset class="field history-fieldset history-fieldset-products" id="filterProducts">
          <legend>Products</legend>
        </fieldset>
      </div>
      <div class="history-summary">
        <span id="historyCounts">0 entries</span>
        <button id="filterReset" type="button" class="btn-utility">Reset filters</button>
      </div>
    </section>

    <section class="results-section" id="historySection" aria-label="History results">
      <div class="message-area" id="historyMessage">Loading history...</div>
      <div id="historyContent"></div>
    </section>

    <footer class="site-footer">
      <div class="footer-inner">
        <a href="/">Back to tracker</a>
      </div>
    </footer>
  </main>
  <script>
    (function () {
      var btn = document.getElementById('themeToggle');
      var label = document.getElementById('themeToggleLabel');
      if (!btn || !label) return;
      var order = ['auto', 'light', 'dark'];
      var labels = { auto: 'Auto', light: 'Light', dark: 'Dark' };
      function render() {
        label.textContent = labels[document.documentElement.dataset.theme] || 'Auto';
      }
      render();
      btn.addEventListener('click', function () {
        var current = document.documentElement.dataset.theme || 'auto';
        var next = order[(order.indexOf(current) + 1) % order.length];
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (_) {}
        render();
      });
    })();
  </script>
  <script src="/history.js"></script>
</body>
</html>
